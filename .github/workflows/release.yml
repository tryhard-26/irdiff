name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "22"
  TARGETS: "X86;AArch64;ARM;RISCV;WebAssembly"

jobs:
  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: linux-aarch64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/install-llvm.sh "$LLVM_VERSION" jammy
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja "llvm@$LLVM_VERSION" zstd gnu-tar
      - name: Configure
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          if [ "$RUNNER_OS" = Linux ]; then
            LLVM_DIR=/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm
            EXTRA="-DIRDIFF_FULLY_STATIC=ON"
          else
            LLVM_DIR="$(brew --prefix "llvm@$LLVM_VERSION")/lib/cmake/llvm"
            EXTRA="-DCMAKE_OSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DIRDIFF_STATIC_LLVM=ON "-DIRDIFF_TARGETS=$TARGETS" $EXTRA \
            "-DCMAKE_CXX_FLAGS=-ffile-prefix-map=$PWD=." \
            -DLLVM_DIR="$LLVM_DIR"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Package
        id: pkg
        run: |
          VERSION=$(sed -n 's/^project(irdiff VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          NAME=irdiff-$VERSION-${{ matrix.target }}
          mkdir -p dist/$NAME/bin dist/$NAME/share/man/man1
          cp build/irdiff dist/$NAME/bin/
          strip -x dist/$NAME/bin/irdiff 2>/dev/null || strip dist/$NAME/bin/irdiff
          cp docs/irdiff.1 dist/$NAME/share/man/man1/
          cp LICENSE README.md CHANGELOG.md dist/$NAME/
          {
            echo "irdiff $VERSION (${{ matrix.target }})"
            echo "commit: $(git rev-parse HEAD)"
            echo "runner: ${{ matrix.os }}"
            echo "compiler: $(${CXX:-c++} --version | head -1)"
            echo "llvm: $(./build/irdiff --version | sed -n 's/^  LLVM \([^ ]*\).*/\1/p')"
          } > dist/$NAME/BUILDINFO
          if [ "$RUNNER_OS" = Linux ]; then TAR=tar; ldd dist/$NAME/bin/irdiff; else TAR=gtar; otool -L dist/$NAME/bin/irdiff; fi
          dist/$NAME/bin/irdiff --version
          MTIME="@$(git log -1 --format=%ct)"
          $TAR -C dist --sort=name --mtime="$MTIME" --owner=0 --group=0 --numeric-owner \
            -cf - $NAME | gzip -n -9 > dist/$NAME.tar.gz
          echo "archive=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Smoke test the packaged binary
        run: |
          mkdir smoke && tar -C smoke -xzf ${{ steps.pkg.outputs.archive }}
          BIN=$(ls smoke/*/bin/irdiff)
          set +e
          $BIN tests/fixtures/flags_a.ll tests/fixtures/flags_b.ll; test $? -eq 1 || exit 1
          $BIN passes tests/fixtures/real/kernels.O0.ll -O2 -F scale_restrict --pass=licm | grep -q "now outside" || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.pkg.outputs.archive }}

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      src-sha: ${{ steps.src.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Source archive
        id: src
        run: |
          V=${GITHUB_REF_NAME#v}
          .github/scripts/srcball.py $V dist/irdiff-$V-src.tar.gz
          echo "sha=$(sha256sum dist/irdiff-$V-src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Checksums and notes
        run: |
          cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS && cd ..
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "Install with Homebrew:"
            echo
            echo '```sh'
            echo "brew tap tryhard-26/irdiff https://github.com/tryhard-26/irdiff"
            echo "brew install tryhard-26/irdiff/irdiff"
            echo '```'
            echo
            echo "Or download an archive below and verify it against \`SHA256SUMS\`."
            echo "Binaries link LLVM $LLVM_VERSION statically."
          } >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "irdiff ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  formula:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the formula at the new source archive
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/irdiff-${GITHUB_REF_NAME#v}-src.tar.gz"
          SHA=${{ needs.publish.outputs.src-sha }}
          sed -i -e "s|^  url \".*\"|  url \"$URL\"|" -e "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/irdiff.rb
          git config user.name "raz0rbill26"
          git config user.email "das.adriteyo26@gmail.com"
          git commit -am "Formula: irdiff ${GITHUB_REF_NAME}" || exit 0
          git push origin main

  brew-test:
    needs: formula
    runs-on: macos-15
    steps:
      - name: Install from the tap and run the formula test
        run: |
          brew tap tryhard-26/irdiff "https://github.com/${GITHUB_REPOSITORY}"
          brew install --build-from-source tryhard-26/irdiff/irdiff
          brew test tryhard-26/irdiff/irdiff
          irdiff --version
